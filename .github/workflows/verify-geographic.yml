name: Verify geographic research artifacts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-geographic.txt
      - name: Install pinned offline GIS tooling
        run: python -m pip install -r requirements-geographic.txt
      - name: Rebuild retained geographic artifacts
        run: |
          npm ci
          npm run data:build:wifi-geographic
          git diff --exit-code -- public/data/wifi-policy/geographic-v1.1/
      - name: Verify original application and policies
        run: |
          npm run data:convert
          npm run data:audit:wifi-policy
          npm run data:build:wifi-policy
          npm test
          npm run build
          git diff --exit-code -- public/data/wifi-policy/
