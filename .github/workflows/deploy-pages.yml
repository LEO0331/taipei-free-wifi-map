name: Deploy to GitHub Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup offline GIS runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install pinned geographic tools
        run: npm run data:setup:geographic

      - name: Convert public data
        run: npm run data:convert

      - name: Test
        run: npm test

      - name: Verify retained policy sources and reproducible snapshot
        run: |
          npm run data:audit:wifi-policy
          npm run data:build:wifi-policy
          npm run data:audit:geographic
          npm run data:build:geographic
          git diff --exit-code -- public/data/wifi-policy/

      - name: Build
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
